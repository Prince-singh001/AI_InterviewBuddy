    <text x="317" y="123" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" fill="#166534" text-anchor="middle">96% Fit</text>

    <!-- Card 2: Google -->
    <rect x="70" y="180" width="280" height="68" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Logo square (Google) -->
    <rect x="84" y="194" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Google colored G icon -->
    <path d="M103 213H112V216C110.8 219.5 107.5 222 103 222C97.5 222 93 217.5 93 212C93 206.5 97.5 202 103 202C105.5 202 107.8 203 109.5 204.6L107 207C105.8 205.8 104.5 205.2 103 205.2C99.2 205.2 96.2 208.2 96.2 212C96.2 215.8 99.2 218.8 103 218.8C105.8 218.8 107.8 217.2 108.5 215.2H103V213Z" fill="#4285F4"/>

    <text x="132" y="203" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">Senior Cloud Architect</text>
    <text x="132" y="214" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#475569">Google • Mountain View, CA</text>

    <rect x="132" y="220" width="46" height="12" rx="3" fill="#E0F2FE"/>
    <text x="155" y="229" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="750" fill="#0284C7" text-anchor="middle">Full-Time</text>
    <rect x="182" y="220" width="56" height="12" rx="3" fill="#CDF5FD"/>
    <text x="210" y="229" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="750" fill="#0077B6" text-anchor="middle">5+ yrs exp</text>

    <rect x="294" y="190" width="46" height="16" rx="8" fill="#DCFCE7"/>
    <text x="317" y="201" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" fill="#166534" text-anchor="middle">91% Fit</text>

    <!-- Card 3: Amazon -->
    <rect x="70" y="258" width="280" height="68" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <!-- Logo square (Amazon) -->
    <rect x="84" y="272" width="38" height="38" rx="8" fill="#131921" stroke="#334155" stroke-width="1"/>
    <path d="M94 294C99 297 106 296 111 293" stroke="#FF9900" stroke-width="2" stroke-linecap="round"/>
    <path d="M109 291L112 293L109 295" stroke="#FF9900" stroke-width="1.5" stroke-linecap="round"/>

    <text x="132" y="281" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">Full Stack SDE II</text>
    <text x="132" y="292" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#475569">Amazon • Seattle, WA</text>

    <rect x="132" y="298" width="46" height="12" rx="3" fill="#E0F2FE"/>
    <text x="155" y="307" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="750" fill="#0284C7" text-anchor="middle">Full-Time</text>
    <rect x="182" y="298" width="56" height="12" rx="3" fill="#CDF5FD"/>
    <text x="210" y="307" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="750" fill="#0077B6" text-anchor="middle">2-4 yrs exp</text>

    <rect x="294" y="268" width="46" height="16" rx="8" fill="#DCFCE7"/>
    <text x="317" y="279" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="800" fill="#166534" text-anchor="middle">89% Fit</text>

    <!-- Right Side: Match Analytics & Target Company Details -->
    <rect x="362" y="102" width="132" height="136" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="374" y="119" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="750" fill="#64748B">SKILL MATCH RADAR</text>

    <!-- Skill Match Bar 1 -->
    <text x="374" y="137" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="600" fill="#1E293B">Python &amp; PyTorch</text>
    <text x="472" y="137" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#00A9FF">98%</text>
    <rect x="374" y="141" width="108" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="374" y="141" width="106" height="4" rx="2" fill="#00A9FF"/>

    <!-- Skill Match Bar 2 -->
    <text x="374" y="159" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="600" fill="#1E293B">System Architecture</text>
    <text x="472" y="159" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#00A9FF">92%</text>
    <rect x="374" y="163" width="108" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="374" y="163" width="99" height="4" rx="2" fill="#00A9FF"/>

    <!-- Skill Match Bar 3 -->
    <text x="374" y="181" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="600" fill="#1E293B">Cloud &amp; DevOps</text>
    <text x="472" y="181" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7" font-weight="700" fill="#00A9FF">88%</text>
    <rect x="374" y="185" width="108" height="4" rx="2" fill="#E2E8F0"/>
    <rect x="374" y="185" width="95" height="4" rx="2" fill="#00A9FF"/>

    <rect x="374" y="202" width="108" height="24" rx="6" fill="#00A9FF"/>
    <text x="428" y="217" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="750" fill="#FFFFFF" text-anchor="middle">Practice for Role</text>
  </g>

  <!-- Floating Callout Card -->
  <g filter="url(#msLogoFloat)">
    <rect x="368" y="252" width="144" height="66" rx="12" fill="#FFFFFF" stroke="#89CFF3" stroke-width="1.5"/>
    <rect x="380" y="264" width="30" height="30" rx="6" fill="#CDF5FD"/>
    <path d="M388 279H402M395 272V286" stroke="#00A9FF" stroke-width="2" stroke-linecap="round"/>
    <text x="418" y="277" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="800" fill="#0F172A">Direct Apply</text>
    <text x="418" y="289" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">Verified top employers</text>
  </g>
</svg>
