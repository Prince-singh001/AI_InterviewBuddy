<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <defs>
    <linearGradient id="jobsBg" x1="0" y1="0" x2="560" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CDF5FD" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A0E9FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="jobsBrandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A9FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <filter id="jobsShadow" x="30" y="30" width="500" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00A9FF" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="msLogoFloat" x="380" y="220" width="150" height="130" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0077B6" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <rect width="560" height="400" rx="24" fill="url(#jobsBg)"/>
  <circle cx="490" cy="70" r="110" fill="#89CFF3" fill-opacity="0.3" filter="blur(30px)"/>
  <circle cx="80" cy="330" r="80" fill="#CDF5FD" fill-opacity="0.6" filter="blur(20px)"/>

  <!-- Main Career Portal Dashboard -->
  <g filter="url(#jobsShadow)">
    <rect x="52" y="44" width="456" height="312" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Dashboard Header -->
    <rect x="52" y="44" width="456" height="42" rx="16" fill="#F8FAFC"/>
    <path d="M52 86H508" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Window controls -->
    <circle cx="74" cy="65" r="4.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="88" cy="65" r="4.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="102" cy="65" r="4.5" fill="#10B981" fill-opacity="0.8"/>

    <!-- Title Search Pill in header -->
    <rect x="124" y="55" width="220" height="20" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="136" cy="65" r="3.5" fill="none" stroke="#94A3B8" stroke-width="1.2"/>
    <line x1="138.5" y1="67.5" x2="142" y2="71" stroke="#94A3B8" stroke-width="1.2" stroke-linecap="round"/>
    <text x="148" y="68.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" fill="#64748B">Filter by role, skills, company...</text>

    <!-- Opportunities Count Pill -->
    <rect x="390" y="56" width="104" height="18" rx="9" fill="#E0F2FE"/>
    <circle cx="400" cy="65" r="3" fill="#00A9FF"/>
    <text x="408" y="68.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#0284C7">MATCHED ROLES (14)</text>

    <!-- Job Opportunity Cards (Left side list) -->
    <!-- Card 1: Microsoft -->
    <rect x="70" y="102" width="280" height="68" rx="10" fill="#F8FAFC" stroke="#89CFF3" stroke-width="1.5"/>
    <!-- Logo square (Microsoft 4 tiles) -->
    <rect x="84" y="116" width="38" height="38" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="92" y="124" width="10" height="10" fill="#F25022"/>
    <rect x="104" y="124" width="10" height="10" fill="#7FBA00"/>
    <rect x="92" y="136" width="10" height="10" fill="#00A4EF"/>
    <rect x="104" y="136" width="10" height="10" fill="#FFB900"/>

    <text x="132" y="125" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="800" fill="#0F172A">AI/ML Engineer</text>
    <text x="132" y="136" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="600" fill="#475569">Microsoft • Bengaluru, India</text>
    
    <rect x="132" y="142" width="46" height="12" rx="3" fill="#E0F2FE"/>
    <text x="155" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="750" fill="#0284C7" text-anchor="middle">Full-Time</text>
    <rect x="182" y="142" width="56" height="12" rx="3" fill="#CDF5FD"/>
    <text x="210" y="151" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="6.5" font-weight="750" fill="#0077B6" text-anchor="middle">3-5 yrs exp</text>

