<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none" role="img" aria-label="Mock Test Assessment Illustration">
  <defs>
    <!-- Brand gradients -->
    <linearGradient id="mtGradBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A9FF"/>
      <stop offset="100%" stop-color="#0077D4"/>
    </linearGradient>
    <linearGradient id="mtGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CDF5FD"/>
      <stop offset="100%" stop-color="#A0E9FF"/>
    </linearGradient>
  </defs>

  <!-- Background Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="#F0F9FF"/>
  <circle cx="256" cy="256" r="175" fill="#E0F2FE" fill-opacity="0.6"/>

  <!-- Assessment Exam Clipboard (Base) -->
  <rect x="110" y="80" width="292" height="370" rx="28" fill="#FFFFFF" stroke="#1E293B" stroke-width="12"/>
  
  <!-- Clipboard Metal Clamp Top -->
  <path d="M190 80 V55 C190 44 199 35 210 35 H302 C313 35 322 44 322 55 V80 Z" fill="#94A3B8" stroke="#1E293B" stroke-width="12"/>
  <circle cx="256" cy="55" r="8" fill="#FFFFFF" stroke="#1E293B" stroke-width="6"/>

  <!-- Inner Test Sheet Header -->
  <rect x="150" y="115" width="130" height="18" rx="9" fill="#00A9FF"/>
  <rect x="290" y="115" width="70" height="18" rx="9" fill="#E2E8F0"/>

  <!-- Question 1 Block with Checkmark -->
  <g transform="translate(150, 160)">
    <!-- Radio/Check Circle -->
    <circle cx="16" cy="16" r="16" fill="#10B981" stroke="#1E293B" stroke-width="6"/>
    <path d="M10 16 L14 20 L22 12" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Question Text Lines -->
    <rect x="46" y="6" width="160" height="10" rx="5" fill="#1E293B"/>
    <rect x="46" y="22" width="110" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Question 2 Block with Checkmark -->
  <g transform="translate(150, 220)">
    <!-- Radio/Check Circle -->
    <circle cx="16" cy="16" r="16" fill="#00A9FF" stroke="#1E293B" stroke-width="6"/>
    <path d="M10 16 L14 20 L22 12" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Question Text Lines -->
    <rect x="46" y="6" width="175" height="10" rx="5" fill="#1E293B"/>
    <rect x="46" y="22" width="130" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Question 3 Block with Active Option -->
  <g transform="translate(150, 280)">
    <circle cx="16" cy="16" r="16" fill="#F8FAFC" stroke="#1E293B" stroke-width="6"/>
    <circle cx="16" cy="16" r="7" fill="#00A9FF"/>
    <!-- Question Text Lines -->
    <rect x="46" y="6" width="150" height="10" rx="5" fill="#1E293B"/>
    <rect x="46" y="22" width="95" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Question 4 Block -->
  <g transform="translate(150, 340)">
    <circle cx="16" cy="16" r="16" fill="#F8FAFC" stroke="#1E293B" stroke-width="6"/>
    <rect x="46" y="6" width="140" height="10" rx="5" fill="#1E293B"/>
    <rect x="46" y="22" width="80" height="8" rx="4" fill="#94A3B8"/>
  </g>

  <!-- Score & Analytics Badge (Floating Right Bottom) -->
  <g transform="translate(325, 330)">
    <circle cx="55" cy="55" r="55" fill="#FFFFFF" stroke="#1E293B" stroke-width="10"/>
    <circle cx="55" cy="55" r="42" fill="url(#mtGradBlue)"/>
    <!-- Circular progress indicator arc -->
    <circle cx="55" cy="55" r="32" fill="#FFFFFF"/>
    <!-- Grade / Score Text -->
    <text x="55" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" fill="#00A9FF" text-anchor="middle">98%</text>
    <!-- Verified Mini Check -->
    <circle cx="90" cy="20" r="14" fill="#10B981" stroke="#1E293B" stroke-width="5"/>
    <path d="M85 20 L89 23 L95 17" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stopwatch / Exam Timer (Floating Top Left) -->
  <g transform="translate(50, 100)">
    <circle cx="45" cy="45" r="40" fill="#FFFFFF" stroke="#1E293B" stroke-width="8"/>
    <!-- Top button -->
    <rect x="40" y="0" width="10" height="10" rx="3" fill="#64748B" stroke="#1E293B" stroke-width="5"/>
    <!-- Clock Hands -->
    <path d="M45 45 L45 25" stroke="#00A9FF" stroke-width="6" stroke-linecap="round"/>
    <path d="M45 45 L58 45" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>
    <circle cx="45" cy="45" r="5" fill="#00A9FF"/>
  </g>

  <!-- Decorative Analytics Sparkles -->
  <path d="M410 110 Q410 125 395 125 Q410 125 410 140 Q410 125 425 125 Q410 125 410 110 Z" fill="#00A9FF"/>
  <circle cx="430" cy="155" r="5" fill="#89CFF3"/>
  <circle cx="95" cy="245" r="6" fill="#FBBF24"/>
</svg>
