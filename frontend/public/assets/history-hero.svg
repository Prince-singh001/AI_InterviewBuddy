<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 400" fill="none">
  <defs>
    <linearGradient id="histBg" x1="0" y1="0" x2="560" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#CDF5FD" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A0E9FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00A9FF"/>
      <stop offset="100%" stop-color="#0077B6"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00A9FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00A9FF" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="histShadow" x="30" y="30" width="500" height="340" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#00A9FF" flood-opacity="0.14"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Ambient background glow -->
  <rect width="560" height="400" rx="24" fill="url(#histBg)"/>
  <circle cx="480" cy="70" r="110" fill="#89CFF3" fill-opacity="0.3" filter="blur(30px)"/>
  <circle cx="90" cy="330" r="80" fill="#CDF5FD" fill-opacity="0.6" filter="blur(20px)"/>

  <!-- Main Dashboard Visual -->
  <g filter="url(#histShadow)">
    <!-- Dashboard Canvas -->
    <rect x="52" y="44" width="456" height="312" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>

    <!-- Dashboard Top Bar -->
    <rect x="52" y="44" width="456" height="42" rx="16" fill="#F8FAFC"/>
    <path d="M52 86H508" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Window control dots -->
    <circle cx="74" cy="65" r="4.5" fill="#EF4444" fill-opacity="0.8"/>
    <circle cx="88" cy="65" r="4.5" fill="#F59E0B" fill-opacity="0.8"/>
    <circle cx="102" cy="65" r="4.5" fill="#10B981" fill-opacity="0.8"/>

    <!-- Dashboard Title / Breadcrumb in header -->
    <rect x="124" y="58" width="120" height="14" rx="4" fill="#E2E8F0"/>
    <text x="132" y="68.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#475569">ACTIVITY &amp; TIMELINE</text>

    <!-- Header Status Indicator -->
    <rect x="414" y="56" width="80" height="18" rx="9" fill="#E0F2FE"/>
    <circle cx="424" cy="65" r="3" fill="#00A9FF"/>
    <text x="432" y="68.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="700" fill="#0284C7">LIVE SYNCED</text>

    <!-- Top Stats Row (2 mini widgets) -->
    <!-- Stat 1: Readiness Trend -->
    <rect x="70" y="102" width="220" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="84" y="119" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#64748B">PERFORMANCE TRAJECTORY</text>
    <text x="84" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="850" fill="#0F172A">92.4%</text>
    <rect x="146" y="128" width="48" height="15" rx="7.5" fill="#DCFCE7"/>
    <text x="170" y="139" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8" font-weight="750" fill="#166534" text-anchor="middle">+14% MoM</text>

    <!-- Trend line in mini widget -->
    <path d="M84 180 Q 120 170, 160 162 T 230 148 T 276 132" fill="none" stroke="#00A9FF" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M84 180 Q 120 170, 160 162 T 230 148 T 276 132 V 186 H 84 Z" fill="url(#chartGrad)"/>
    <circle cx="276" cy="132" r="3.5" fill="#00A9FF" stroke="#FFFFFF" stroke-width="1.5"/>

    <!-- Stat 2: Completed Sessions Summary -->
    <rect x="302" y="102" width="190" height="92" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="316" y="119" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="700" fill="#64748B">SESSIONS COMPLETED</text>
    <text x="316" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="850" fill="#0F172A">18</text>
    <text x="342" y="142" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600" fill="#64748B">verified logs</text>

    <rect x="316" y="154" width="76" height="6" rx="3" fill="#E2E8F0"/>
    <rect x="316" y="154" width="58" height="6" rx="3" fill="#00A9FF"/>
    <text x="316" y="176" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="600" fill="#64748B">Mock • Test • Practice</text>

    <!-- Timeline Entries List -->
    <rect x="70" y="206" width="422" height="136" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
    <text x="84" y="224" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="8.5" font-weight="750" fill="#0F172A">VERIFIED SESSION TIMELINE</text>

    <!-- Row 1: Mock Interview -->
    <g transform="translate(84, 234)">
      <circle cx="10" cy="12" r="10" fill="#E0F2FE"/>
      <path d="M7 12L9.5 14.5L13.5 9.5" stroke="#00A9FF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="750" fill="#0F172A">AI Mock Interview — AI / ML Engineer</text>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">Technical &amp; System Architecture • Oct 7, 2026</text>
      
      <rect x="320" y="4" width="62" height="16" rx="8" fill="#DCFCE7"/>
      <text x="351" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="750" fill="#166534" text-anchor="middle">Score 94%</text>
    </g>

    <line x1="84" y1="267" x2="478" y2="267" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 2: Mock Test -->
    <g transform="translate(84, 272)">
      <circle cx="10" cy="12" r="10" fill="#FEF3C7"/>
      <path d="M7 12L9.5 14.5L13.5 9.5" stroke="#D97706" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="28" y="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="750" fill="#0F172A">Role Assessment Test — Full Stack Engineer</text>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">MCQ &amp; Scenario Evaluation • Oct 5, 2026</text>

      <rect x="320" y="4" width="62" height="16" rx="8" fill="#DCFCE7"/>
      <text x="351" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="750" fill="#166534" text-anchor="middle">Score 88%</text>
    </g>

    <line x1="84" y1="305" x2="478" y2="305" stroke="#F1F5F9" stroke-width="1"/>

    <!-- Row 3: Practice Session -->
    <g transform="translate(84, 310)">
      <circle cx="10" cy="12" r="10" fill="#EDE9FE"/>
      <circle cx="10" cy="12" r="3" fill="#8B5CF6"/>
      <text x="28" y="11" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="750" fill="#0F172A">Concept Practice — Algorithms &amp; Data Structures</text>
      <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="500" fill="#64748B">Dynamic Programming &amp; Trees • Oct 2, 2026</text>

      <rect x="320" y="4" width="62" height="16" rx="8" fill="#F1F5F9"/>
      <text x="351" y="15" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="7.5" font-weight="750" fill="#475569" text-anchor="middle">Completed</text>
    </g>
  </g>
</svg>
